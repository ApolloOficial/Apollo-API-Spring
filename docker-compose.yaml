services:
  postgres:
    image: postgres:17.9
    container_name: apollo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-apollo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apollo123}
      POSTGRES_DB: ${DB_NAME:-dbapollo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - apollo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apollo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dbapollo}
      DB_USER: ${DB_USER:-apollo}
      DB_PASSWORD: ${DB_PASSWORD:-apollo123}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SUNGROW_ENABLED: ${SUNGROW_ENABLED:-false}
      SUNGROW_BASE_URL: ${SUNGROW_BASE_URL:-https://gateway.isolarcloud.com.hk}
      SUNGROW_APPKEY: ${SUNGROW_APPKEY:-}
      SUNGROW_ACCESS_KEY: ${SUNGROW_ACCESS_KEY:-}
      SUNGROW_REDIRECT_URI: ${SUNGROW_REDIRECT_URI:-}
      SUNGROW_PLANT_MODE: ${SUNGROW_PLANT_MODE:-live}
      SUNGROW_DATA_SOURCE: ${SUNGROW_DATA_SOURCE:-SENSOR}
      SUNGROW_POLL_INTERVAL_SECONDS: ${SUNGROW_POLL_INTERVAL_SECONDS:-300}
      TRACKING_ENABLED: ${TRACKING_ENABLED:-false}
      TRACKING_MONGO_URI: ${TRACKING_MONGO_URI:-${MONGODB_URI:-mongodb://localhost:27017}}
      TRACKING_SPOOL_DIR: /var/lib/apollo/tracking-spool
      TRACKING_FLUSH_DELAY_MS: ${TRACKING_FLUSH_DELAY_MS:-10000}
    volumes:
      - apollo_tracking_spool:/var/lib/apollo/tracking-spool
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  apollo_postgres_data:
  apollo_tracking_spool:
