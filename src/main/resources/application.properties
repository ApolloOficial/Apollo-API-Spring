spring.application.name=Apollo-API-Spring
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:apollodb}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER:apollo}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
logging.level.org.springframework.security=INFO
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# JWT Configuration
apollo.jwt.secret=${JWT_SECRET}
apollo.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
apollo.jwt.issuer=apollo-api
apollo.jwt.audience=apollo-api-client

apollo.chatbot.base-url=${CHATBOT_BASE_URL:https://chatbot-apolloai.onrender.com}
apollo.chatbot.token=${CHATBOT_API_TOKEN:}
apollo.chatbot.timeout-seconds=${CHATBOT_TIMEOUT_SECONDS:90}

# Swagger desligado por padrao; ligue com SWAGGER_ENABLED=true
app.swagger.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Actuator: somente /health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Push (Firebase Cloud Messaging): vazio = desligado. B64 = base64 do JSON da service account
app.firebase.credentials-b64=${FIREBASE_CREDENTIALS_B64:}
app.firebase.credentials-file=${FIREBASE_CREDENTIALS_FILE:}
app.push.poll-ms=${PUSH_POLL_MS:15000}
