spring.application.name=Apollo-API-Spring
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:apollodb}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER:apollo}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
logging.level.org.springframework.security=INFO
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# JWT Configuration
apollo.jwt.secret=${JWT_SECRET}
apollo.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
apollo.jwt.issuer=apollo-api
apollo.jwt.audience=apollo-api-client

apollo.chatbot.base-url=${CHATBOT_BASE_URL:https://chatbot-apolloai.onrender.com}
apollo.chatbot.token=${CHATBOT_API_TOKEN:}
apollo.chatbot.timeout-seconds=${CHATBOT_TIMEOUT_SECONDS:90}

# Sungrow iSolarCloud (leitura dos dados do inversor). Desligado por padrao: ligue com SUNGROW_ENABLED=true
# e informe appkey, access key e redirect URI do portal de desenvolvedores da Sungrow.
apollo.sungrow.enabled=${SUNGROW_ENABLED:false}
apollo.sungrow.base-url=${SUNGROW_BASE_URL:https://gateway.isolarcloud.com.hk}
apollo.sungrow.appkey=${SUNGROW_APPKEY:}
apollo.sungrow.access-key=${SUNGROW_ACCESS_KEY:}
apollo.sungrow.redirect-uri=${SUNGROW_REDIRECT_URI:}
apollo.sungrow.poll-interval-seconds=${SUNGROW_POLL_INTERVAL_SECONDS:300}
apollo.sungrow.brand=${SUNGROW_BRAND:Sungrow}
apollo.sungrow.device-time-zone=${SUNGROW_DEVICE_TIME_ZONE:America/Sao_Paulo}
apollo.sungrow.batch-size=${SUNGROW_BATCH_SIZE:20}
# live = planta real (chama a API da Sungrow); simulated = planta simulada na propria API (demonstracao):
# nao precisa de credenciais nem de autorizacao e grava data_source=SIMULATOR
apollo.sungrow.plant-mode=${SUNGROW_PLANT_MODE:live}
apollo.sungrow.data-source=${SUNGROW_DATA_SOURCE:SENSOR}
apollo.sungrow.simulation-step-minutes=${SUNGROW_SIMULATION_STEP_MINUTES:5}
apollo.sungrow.simulation-always-sun=${SUNGROW_SIMULATION_ALWAYS_SUN:false}
apollo.sungrow.simulation-fault-serials=${SUNGROW_SIMULATION_FAULT_SERIALS:}
apollo.sungrow.simulation-weak-strings=${SUNGROW_SIMULATION_WEAK_STRINGS:}
# Caminhos dos endpoints. O de tempo real ainda deve ser conferido no botao "Try it" do portal.
apollo.sungrow.token-path=${SUNGROW_TOKEN_PATH:/openapi/apiManage/token}
apollo.sungrow.refresh-path=${SUNGROW_REFRESH_PATH:/openapi/apiManage/refreshToken}
apollo.sungrow.real-time-path=${SUNGROW_REAL_TIME_PATH:/openapi/platform/getDeviceRealTimeData}

# Swagger desligado por padrao; ligue com SWAGGER_ENABLED=true
app.swagger.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Actuator: somente /health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Push (Firebase Cloud Messaging): vazio = desligado. B64 = base64 do JSON da service account
app.firebase.credentials-b64=${FIREBASE_CREDENTIALS_B64:}
app.firebase.credentials-file=${FIREBASE_CREDENTIALS_FILE:}
app.push.poll-ms=${PUSH_POLL_MS:15000}
