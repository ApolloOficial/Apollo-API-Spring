services:
  postgres:
    image: postgres:17.9
    container_name: apollo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apollo
      POSTGRES_PASSWORD: apollo123
      POSTGRES_DB: dbapollo
    ports:
      - "5432:5432"
    volumes:
      - apollo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  apollo_postgres_data: